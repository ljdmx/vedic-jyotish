<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>观星录｜吠陀占星</title>
  <!-- 墨色圆底（与顶栏 .brand-seal 一致） -->
  <circle cx="32" cy="32" r="30" fill="#242826"/>
  <!-- 朱砂虚线印章边（呼应纸本印泥质感） -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="rgba(164,95,73,.7)" stroke-width="1" stroke-dasharray="1.6 1.2"/>
  <!-- "观" 字 衬线 -->
  <text x="32" y="44" font-family="Songti SC, STSong, SimSun, Noto Serif SC, serif" font-size="34" font-weight="500" text-anchor="middle" fill="#e7dfd0">观</text>
  <!-- 朱砂小点缀（呼应 .brand-seal::after） -->
  <circle cx="46" cy="20" r="1.4" fill="#a45f49"/>
  <circle cx="19" cy="44" r="1" fill="rgba(164,95,73,.55)"/>
</svg>